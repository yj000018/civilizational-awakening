name: Provider workflow compatibility
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/verification/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/verification/**']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/verification/verify_provider_workflows.py
      - run: python --version && node --version
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - run: pnpm --version
      - uses: actions/upload-artifact@v7.0.1
        with:
          archive: true
          name: provider-workflow-compatibility
          path: provider-workflow-compatibility.json
          if-no-files-found: error
          retention-days: 7
